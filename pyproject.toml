[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bishops_graph_metric_dimension"
version = "1.0.0"
description = "Exact metric dimension of bishop colour components (diamond rook reformulation, ILP computation, closed-form conjectures) — code, data, manuscript"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "rajveersinh-is-dev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/rajveersinh-is-dev/bishops-graph-metric-dimension"

[tool.setuptools]
py-modules = ['']
